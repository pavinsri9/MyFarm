services:

  myfarm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfarm-api
    restart: unless-stopped

    ports:
      - "5231:5231"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 5231

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=myfarmdb;Username=myfarmuser;Password=myfarmpassword"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - myfarm-network


  postgres:
    image: postgres:17
    container_name: myfarm-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: myfarmdb
      POSTGRES_USER: myfarmuser
      POSTGRES_PASSWORD: myfarmpassword

    volumes:
      - postgres-data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfarmuser -d myfarmdb"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - myfarm-network


networks:
  myfarm-network:
    driver: bridge


volumes:
  postgres-data: